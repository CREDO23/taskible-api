version: "3"

services:
  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: pas123
      POSTGRES_DB: team_tasks_management

  db-test:
    image: postgres
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: pas123
      POSTGRES_DB: team_tasks_management_test
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
    